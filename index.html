<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>二一之前</title>
<meta name="description" content="八個學期，每一次選擇都記在成績單和名單上。">
<meta property="og:type" content="website">
<meta property="og:title" content="二一之前">
<meta property="og:description" content="八個學期，每一次選擇都記在成績單和名單上。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%223%22 fill=%22%23f4f1e8%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22none%22 stroke=%22%23b3261e%22 stroke-width=%222.5%22/%3E%3Cpath d=%22M11 16h10%22 stroke=%22%23b3261e%22 stroke-width=%222.5%22/%3E%3C/svg%3E">
<style>
:root{
  /* 卷宗紙張 */
  --paper:#f4f1e8;
  --sheet:#fbfaf5;
  --sheet-2:#efebdf;
  /* 墨色 */
  --ink:#15171b;
  --ink-2:#4c525c;
  --ink-3:#7d8590;
  /* 細線 */
  --rule:#cfc9b8;
  --rule-2:#e2ddcf;
  /* 校務紅印 */
  --stamp:#b3261e;
  --stamp-soft:#b3261e18;
  /* 判定色 */
  --pass:#1f6b48;
  --fail:#b3261e;
  --note:#1f4e79;
  --warn:#9a5b00;

  --serif:'Noto Serif TC','Songti TC','Source Han Serif TC','SimSun','PMingLiU',serif;
  --sans:-apple-system,'PingFang TC','Microsoft JhengHei','Noto Sans TC','Helvetica Neue',sans-serif;
  --num:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--sheet);box-shadow:0 0 0 1px var(--rule-2)}

/* ================= 學籍卡（頁首） ================= */
#board{position:sticky;top:0;z-index:20;background:var(--sheet);
  border-bottom:2px solid var(--ink);padding:10px 14px 9px}
#board::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:3px;
  border-top:1px solid var(--rule);pointer-events:none}

#bd-top{display:flex;align-items:flex-start;gap:10px}
#bd-id{flex:1;min-width:0}
#bd-name{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.02em;
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bd-meta{font-size:11.5px;color:var(--ink-2);margin-top:2px;font-family:var(--num);letter-spacing:.02em}
#bd-flags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.flag{font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border:1px solid currentColor;border-radius:2px;
  font-weight:700;line-height:1.6}
.flag.bad{color:var(--fail)} .flag.good{color:var(--pass)} .flag.note{color:var(--note)}

/* 人斬印章 */
#killbox{flex:none;text-align:center;border:2px solid var(--stamp);border-radius:3px;
  padding:3px 9px 2px;color:var(--stamp);background:var(--stamp-soft);
  transform:rotate(-2.5deg);min-width:62px}
#bd-kills{display:block;font-family:var(--num);font-size:25px;font-weight:700;line-height:1.05;
  letter-spacing:-.02em}
#killbox span{display:block;font-size:9.5px;letter-spacing:.28em;font-weight:700;
  margin-top:1px;padding-left:.28em}

#btn-restart{flex:none;background:none;border:1px solid var(--rule);color:var(--ink-3);
  border-radius:2px;font-size:15px;line-height:1;padding:5px 7px;cursor:pointer;font-family:var(--serif)}
#btn-restart:hover{border-color:var(--ink);color:var(--ink)}

/* 八學期進度格 */
#semstrip{display:flex;gap:3px;margin-top:9px;align-items:stretch}
.sem{flex:1;text-align:center;font-size:9.5px;font-family:var(--num);color:var(--ink-3);
  border:1px solid var(--rule-2);border-radius:2px;padding:2px 0 1px;background:var(--sheet-2);
  letter-spacing:-.03em}
.sem.done{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.sem.now{border:1.5px solid var(--stamp);color:var(--stamp);background:var(--sheet);font-weight:700}
.sem.fail{background:var(--fail);color:#fff;border-color:var(--fail)}

/* 階段列 */
#phaseline{display:flex;gap:0;margin-top:6px;border-top:1px solid var(--rule-2);padding-top:5px}
.ph{flex:1;text-align:center;font-size:10px;color:var(--ink-3);letter-spacing:.02em;position:relative}
.ph.on{color:var(--stamp);font-weight:700}
.ph.on::after{content:'';position:absolute;left:22%;right:22%;bottom:-5px;height:2px;background:var(--stamp)}

/* 能力細線條 */
#abrows{margin-top:8px;display:grid;gap:4px}
.ab{display:flex;align-items:center;gap:8px;font-size:11.5px}
.ab .nm{width:38px;flex:none;color:var(--ink-2);letter-spacing:.04em}
.ab .track{flex:1;height:11px;position:relative;border-bottom:1px solid var(--rule)}
.ab .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--ink)}
.ab.short .fill{background:var(--fail)}
.ab .tick{position:absolute;bottom:-3px;width:1.5px;height:11px;background:var(--stamp)}
.ab .tick::after{content:'';position:absolute;top:-3px;left:-2px;width:5.5px;height:3px;background:var(--stamp);
  clip-path:polygon(50% 100%,0 0,100% 0)}
.ab .tick.met{background:var(--pass)} .ab .tick.met::after{background:var(--pass)}
.ab .val{font-family:var(--num);width:54px;text-align:right;flex:none;font-size:12px;font-weight:700}
.ab .val s{color:var(--ink-3);text-decoration:none;font-size:10px;font-weight:400}
.ab.short .val{color:var(--fail)}

/* ================= 紀錄（卷宗內頁） ================= */
#log{flex:1;padding:12px 14px 18px;display:flex;flex-direction:column}
.yr-block{margin-bottom:2px}
.yr-head{font-family:var(--serif);font-size:12px;letter-spacing:.22em;color:var(--ink-2);
  padding:9px 0 7px;cursor:pointer;user-select:none;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:baseline}
.yr-head::after{content:'－';font-family:var(--num);color:var(--ink-3);font-size:11px}
.yr-block.collapsed .yr-head::after{content:'＋'}
.yr-head:hover{color:var(--ink)}
.yr-block.collapsed .yr-body{display:none}
.yr-body{display:flex;flex-direction:column}

/* 一則紀錄 */
.card{padding:10px 0 11px;border-bottom:1px solid var(--rule-2);animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card h4{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);font-weight:700;margin-bottom:4px;
  display:flex;align-items:center;gap:6px;font-family:var(--sans)}
.card h4::before{content:'';width:14px;height:2px;background:var(--ink-3);flex:none}
.card.good h4{color:var(--pass)} .card.good h4::before{background:var(--pass)}
.card.bad h4{color:var(--fail)} .card.bad h4::before{background:var(--fail)}
.card.info h4{color:var(--note)} .card.info h4::before{background:var(--note)}
.card.gold h4{color:var(--stamp)} .card.gold h4::before{background:var(--stamp);height:3px}
.card p{font-family:var(--serif);font-size:14.5px;line-height:1.78;white-space:pre-line;color:var(--ink)}
.card.gold{background:linear-gradient(var(--sheet-2),var(--sheet));padding-left:11px;
  border-left:3px solid var(--stamp);margin:2px 0}

/* 效果標籤 */
.eff{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.eff span{font-family:var(--num);font-size:11px;padding:1px 5px;border:1px solid var(--rule);
  border-radius:2px;background:var(--sheet-2);letter-spacing:-.01em;line-height:1.7}
.eff .up{color:var(--pass);border-color:#1f6b4855}
.eff .dn{color:var(--fail);border-color:#b3261e55}

/* 對象清單 */
.det{margin-top:7px;border-top:1px dotted var(--rule);padding-top:6px}
.det .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:1.5px 0;
  font-family:var(--num);color:var(--ink-2)}
.det .row b{font-family:var(--sans);font-weight:400;color:var(--ink-2)}
.det .row.ok b{color:var(--ink);font-weight:700}
.det .row.ok{color:var(--pass)}

/* ================= 操作區（受理欄） ================= */
/* 收合標籤與操作區包在同一個 sticky 容器裡。
 * 先前兩者是各自獨立的兄弟元素,只有操作區是 sticky,
 * 結果標籤留在文件流的原位、被固定在底部的操作區蓋過去,
 * 壓在第一個按鈕上面擋住點擊(實測重疊 3px)。 */
#dock{position:sticky;bottom:0;z-index:20}
#act-toggle{display:block;margin:0 auto -1px;background:var(--sheet);border:1px solid var(--rule);
  border-bottom:none;color:var(--ink-3);font-size:10.5px;padding:3px 16px;
  border-radius:3px 3px 0 0;cursor:pointer;letter-spacing:.08em;position:relative;z-index:1}
#act-toggle:hover{color:var(--ink);border-color:var(--ink)}
#act{background:var(--sheet);border-top:2px solid var(--ink);
  padding:10px 14px calc(11px + env(safe-area-inset-bottom))}
#act.collapsed{display:none!important}
#act .title{font-family:var(--serif);font-size:12.5px;letter-spacing:.1em;color:var(--ink-2);
  margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--rule-2);font-weight:700}
#act .title b{color:var(--stamp);font-family:var(--num)}
#act .desc{font-family:var(--serif);font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-bottom:8px}

/* 按鈕：文件表單的選項列 */
.btn{display:block;width:100%;background:var(--sheet);border:1px solid var(--rule);color:var(--ink);
  font-family:var(--sans);font-size:14.5px;font-weight:700;border-radius:3px;
  padding:10px 12px;margin-top:6px;cursor:pointer;text-align:left;transition:.12s;
  min-height:44px;position:relative}
.btn:hover{border-color:var(--ink);background:var(--sheet-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;background:var(--sheet-2)}
.btn small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-2);margin-top:2px;
  font-family:var(--num);letter-spacing:-.01em}
.btn.main{background:var(--ink);color:var(--sheet);border-color:var(--ink);text-align:center}
.btn.main:hover{background:#000}
.btn.main small{color:#ffffffb0}
.btn.stamp{border:2px solid var(--stamp);color:var(--stamp)}
.btn.stamp small{color:#b3261ec0}
.btn.warn{border-color:#b3261e66}
.btn.warn small{color:var(--fail)}

/* 場所兩欄 */
.venues{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.venues .btn{margin-top:0;padding:9px 10px;font-size:14px;min-height:52px}
.venues .btn small{font-size:10.5px;margin-top:2px}
.venues .btn i{font-style:normal;color:var(--stamp);font-family:var(--num);font-weight:700;
  font-size:12px;margin-left:4px}
.locked-wrap{margin-top:7px;border-top:1px dashed var(--rule);padding-top:6px}
.locked-head{font-size:11.5px;color:var(--ink-3);cursor:pointer;user-select:none;
  display:flex;justify-content:space-between;align-items:center;padding:3px 0;letter-spacing:.04em}
.locked-head::after{content:'＋';font-family:var(--num)}
.locked-wrap.open .locked-head::after{content:'－'}
.locked-head:hover{color:var(--ink)}
.locked-wrap .venues{display:none}
.locked-wrap.open .venues{display:grid}
.locked-wrap .btn{opacity:.55}

/* 對象卷宗（特殊角色決策） */
#dossier{border:1px solid var(--ink);border-radius:3px;padding:10px 12px;margin-bottom:8px;
  background:var(--sheet-2)}
#dossier .dn{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.25}
#dossier .dt{display:inline-block;font-size:11px;color:var(--stamp);border:1px solid var(--stamp);
  border-radius:2px;padding:0 5px;margin-left:6px;font-weight:700;vertical-align:2px;letter-spacing:.04em}
#dossier .dd{font-family:var(--serif);font-size:13.5px;color:var(--ink-2);line-height:1.75;margin-top:6px}
#dossier .dm{font-family:var(--num);font-size:11.5px;color:var(--ink-2);margin-top:7px;
  border-top:1px dotted var(--rule);padding-top:5px;display:flex;gap:12px}

/* ================= 骰子 ================= */
#dice{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.die{width:46px;height:46px;border-radius:4px;position:relative;cursor:pointer;transition:.12s;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:7px;gap:2px;background:var(--sheet);border:1.5px solid var(--ink)}
.die i{background:var(--ink);border-radius:50%;align-self:center;justify-self:center;
  width:100%;height:100%;max-width:8px;max-height:8px}
.pc1{grid-area:1/1}.pc2{grid-area:1/2}.pc3{grid-area:1/3}
.pc4{grid-area:2/1}.pc5{grid-area:2/2}.pc6{grid-area:2/3}
.pc7{grid-area:3/1}.pc8{grid-area:3/2}.pc9{grid-area:3/3}
/* 六點：紅印 */
.die.six{border-color:var(--stamp);background:var(--stamp-soft)}
.die.six i{background:var(--stamp)}
.die.used{opacity:.2;cursor:default}
.die.active{outline:2px solid var(--stamp);outline-offset:2px;background:var(--sheet-2)}
.die b{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.alloc{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.alloc .btn{margin-top:0;min-height:56px}

/* ================= 開場（申請表） ================= */
#start{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto}
#start .wrap{max-width:560px;margin:0 auto;background:var(--sheet);min-height:100%;
  padding:34px 22px 50px;box-shadow:0 0 0 1px var(--rule-2)}
#start .kicker{font-family:var(--num);font-size:10.5px;letter-spacing:.24em;color:var(--ink-3);
  border-bottom:1px solid var(--rule);padding-bottom:7px;display:flex;justify-content:space-between}
#start h1{font-family:var(--serif);font-size:44px;font-weight:900;letter-spacing:.1em;
  line-height:1.15;margin:20px 0 0;text-indent:.1em}
#start .sub{font-family:var(--serif);color:var(--ink-2);margin:11px 0 0;font-size:14.5px;line-height:1.8}
/* 紅印的位置要避開副標第一行,否則圓弧下緣會壓到「名單上」那幾個字 */
#start .seal{position:absolute;top:60px;right:24px;width:72px;height:72px;border:2.5px solid var(--stamp);
  border-radius:50%;color:var(--stamp);display:flex;align-items:center;justify-content:center;
  transform:rotate(-11deg);opacity:.85;pointer-events:none}
#start .seal span{font-family:var(--serif);font-size:15px;font-weight:900;letter-spacing:.06em;
  line-height:1.15;text-align:center}
.field{margin-top:22px}
.field label{display:block;font-size:11px;letter-spacing:.2em;color:var(--ink-2);font-weight:700;
  margin-bottom:7px;font-family:var(--num)}
.field input{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--ink);
  color:var(--ink);font-family:var(--serif);font-size:19px;padding:5px 2px;outline:none}
.field input::placeholder{color:var(--ink-3);font-size:17px}
.field input:focus{border-color:var(--stamp)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;color:var(--ink-2);
  font-family:var(--sans);font-size:14.5px;font-weight:700;padding:11px 6px;cursor:pointer;min-height:46px}
.seg button.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
#dept-note{margin-top:10px;border:1px solid var(--rule);border-left:3px solid var(--ink);
  padding:8px 10px;background:var(--sheet-2);min-height:70px}
#dept-note .n1{font-family:var(--serif);font-size:14px;font-weight:700;line-height:1.6}
#dept-note .n2{font-family:var(--num);font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.75}
.seedline{font-family:var(--num);font-size:11.5px;color:var(--ink-2);margin-top:24px;
  border-top:1px solid var(--rule);padding-top:10px;line-height:1.9}
.seedline input{width:118px;background:var(--sheet-2);color:var(--ink);border:1px solid var(--rule);
  border-radius:2px;padding:2px 6px;font-family:inherit;font-size:11.5px;text-align:center}
.seedline a{color:var(--note)}
#ver{font-family:var(--num);font-size:10px;letter-spacing:.1em;color:var(--ink-3)}

/* ================= 視窗（受理回覆） ================= */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:#15171bb0;padding:16px}
#modal.on{display:flex;animation:fade .16s ease}
#modal-box{background:var(--sheet);border:1px solid var(--ink);border-radius:3px;
  width:100%;max-width:470px;max-height:82vh;display:flex;flex-direction:column;
  box-shadow:0 16px 40px #15171b55;animation:rise .18s ease}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
#modal-head{font-family:var(--serif);padding:11px 15px 9px;border-bottom:2px solid var(--ink);
  font-size:14px;letter-spacing:.08em;font-weight:700;flex:none;
  display:flex;justify-content:space-between;align-items:baseline}
#modal-head::after{content:'受理';font-family:var(--num);font-size:9.5px;letter-spacing:.2em;
  color:var(--stamp);border:1px solid var(--stamp);border-radius:2px;padding:0 4px;font-weight:700}
#modal-body{padding:4px 15px 10px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
#modal-body .card:last-child{border-bottom:none}
#modal-foot{padding:9px 15px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule);flex:none}
#modal-foot .btn{margin-top:0}
#modal-foot .btn+.btn{margin-top:6px}

/* ================= 結局（結案報告） ================= */
.end-hero{border-bottom:2px solid var(--ink);padding:4px 0 10px;margin-bottom:9px}
.end-hero .tier{font-family:var(--serif);font-size:23px;font-weight:900;letter-spacing:.04em;line-height:1.3}
.end-hero .num{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.end-hero .num b{font-family:var(--num);font-size:46px;font-weight:700;color:var(--stamp);
  line-height:1;letter-spacing:-.03em}
.end-hero .num span{font-size:11px;letter-spacing:.2em;color:var(--ink-2);font-weight:700}
table.fin{width:100%;border-collapse:collapse;font-family:var(--num);font-size:12px;margin-top:8px}
table.fin th,table.fin td{border-bottom:1px solid var(--rule-2);padding:5px 2px;text-align:right}
table.fin th{color:var(--ink-3);font-weight:400;font-size:10.5px;letter-spacing:.1em;
  border-bottom:1px solid var(--rule)}
table.fin td:first-child,table.fin th:first-child{text-align:left;font-family:var(--sans);color:var(--ink-2)}
table.fin td{font-weight:700}
.namelist{font-family:var(--serif);font-size:13px;color:var(--ink-2);line-height:2;margin-top:10px;
  border-top:1px solid var(--rule);padding-top:8px}
.namelist .h{display:block;font-family:var(--num);font-size:10.5px;letter-spacing:.2em;
  color:var(--ink-3);margin-bottom:3px;font-weight:700}
.namelist .g{color:var(--pass);font-weight:700}
.namelist .b{color:var(--fail);font-weight:700}
.namelist .x{color:var(--ink-3)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){
  #start h1{font-size:38px}
  .venues{gap:5px}
  .ab .nm{width:34px}
}
</style>
</head>
<body>

<div id="start">
  <div class="wrap">
    <div class="kicker"><span>學 生 事 務 處 ・ 個 案 建 檔</span><span id="ver"></span></div>
    <div class="seal"><span>建檔<br>受理</span></div>
    <h1>二一之前</h1>
    <p class="sub">八個學期，每一次選擇都記在成績單和名單上。<br>期末沒過就沒有下一頁。</p>

    <div class="field">
      <label>學 生 姓 名</label>
      <input id="in-name" maxlength="10" placeholder="朱董">
    </div>

    <div class="field">
      <label>就 讀 學 系</label>
      <div class="seg" id="seg-dept"></div>
      <div id="dept-note"></div>
    </div>

    <button class="btn main" style="margin-top:26px" id="btn-start">建檔並開始 ▸ 大一上學期</button>

    <p class="seedline">檔案編號
      <input id="seed-show" maxlength="24">
      <a href="#" id="seed-re">重新編號</a><br>
      相同編號加上相同選擇，會得到完全相同的一份檔案。<br>
      把整串網址給別人，對方就會拿到跟你一樣的開局。</p>
  </div>
</div>

<div id="app">
  <header id="board" style="display:none">
    <div id="bd-top">
      <div id="bd-id">
        <div id="bd-name"></div>
        <div id="bd-meta"></div>
        <div id="bd-flags"></div>
      </div>
      <div id="killbox"><b id="bd-kills">0</b><span>人斬</span></div>
      <button id="btn-restart" title="重新建檔">↺</button>
    </div>
    <div id="semstrip"></div>
    <div id="phaseline"></div>
    <div id="abrows"></div>
  </header>

  <main id="log"></main>

  <div id="dock">
    <button id="act-toggle" style="display:none">收 合</button>
    <footer id="act" style="display:none"></footer>
  </div>
</div>

<div id="modal">
  <div id="modal-box">
    <div id="modal-head"></div>
    <div id="modal-body"></div>
    <div id="modal-foot"><button class="btn main" id="modal-ok">確 認</button></div>
  </div>
</div>

<script type="module" src="./src/ui/render.js"></script>
</body>
</html>
