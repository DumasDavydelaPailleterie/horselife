/* 攻略判定 — 核心公式
 * 依規格草案 5.5 節:
 *   成功率(%) = 技巧力×0.6 + 肌力×0.3 + 體力×0.1 − 對象難度修正 − 風評修正
 */






/* 計算對某位對象的成功率(百分比) */
function conquestRate(S, difficulty) {
  const w = CONFIG.conquestWeights;
  const base =
    S.ab.skl * w.skl + S.ab.str * w.str + S.ab.sta * w.sta + S.ab.int * w.int;
  const diffPen = CONFIG.difficultyPenalty[difficulty] ?? 0;
  const repPen = Math.floor(Math.max(0, S.rep) / CONFIG.repPenaltyDiv);
  const raw = base - diffPen - repPen;
  return clamp(raw, CONFIG.conquestRateMin, CONFIG.conquestRateMax);
}

/* 取得對某位對象的實際成功率。
 * 少數角色(目前只有校醫室的護理師)有固定成功率,不套用一般公式,
 * 因為她們的門檻設計在「玩家有沒有想到要去那個地方」,而不是能力值高低。 */
function rateFor(S, target) {
  if (typeof target?.fixedRate === 'number') return target.fixedRate;
  return conquestRate(S, target?.difficulty ?? target?.diff);
}

/* 套用女角的特殊效果。回傳套用明細與是否觸發登出 */
function applyGirlEffect(S, girl) {
  const eff = girl.eff;
  if (!eff) return { applied: [], fatal: null, std: null };

  const applied = [];
  let fatal = null;
  let std = null;
  let immuneBlocked = false;   /* 因為已免疫而擋掉的感染 */

  for (const [key, v] of Object.entries(eff)) {
    switch (key) {
      case 'sta': case 'int': case 'str': {
        const actual = addAb(S, key, v);
        applied.push({ key, amount: v, actual });
        break;
      }
      case 'skl': {
        const actual = addSkl(S, v);
        applied.push({ key, amount: v, actual });
        break;
      }
      case 'enc':  S.encBonus += v;  applied.push({ key, amount: v, actual: v }); break;
      case 'slot': S.bonusSlots += v; applied.push({ key, amount: v, actual: v }); break;
      case 'risk': S.risk += v;      applied.push({ key, amount: v, actual: v }); break;
      case 'rep':
        S.rep = Math.max(0, S.rep + v);
        applied.push({ key, amount: v, actual: v });
        break;
      case 'std': {
        const r = infect(S, v);
        std = r.changed ? r : null;
        if (r.changed) applied.push({ key: 'std', amount: v, actual: v });
        else if (r.immune) immuneBlocked = true;
        break;
      }
      case 'immune': {
        const r = grantImmunity(S);
        if (r.changed) applied.push({ key: 'immune', amount: 1, actual: 1 });
        break;
      }
      case 'fatal':
        fatal = v;
        break;
      default:
        throw new Error(`女角效果使用了未知的鍵:${key}`);
    }
  }
  return { applied, fatal, std, immuneBlocked };
}

/* 對一位對象進行一次攻略判定並套用結果 */
function attemptConquest(S, target, rng) {
  const rate = rateFor(S, target);
  const success = rng.chance(rate);

  S.stats.attempts++;
  /* 記錄已經接觸過的名冊角色,同一局不會再遇到 */
  if (target.id && !S.metIds.includes(target.id)) S.metIds.push(target.id);

  if (!success) {
    /* 失敗也給少量經驗,避免開局死鎖 */
    addSkl(S, CONFIG.sklOnFail);
    return {
      success: false, rate, target, counted: false,
      sklGain: CONFIG.sklOnFail, applied: [], fatal: null, std: null,
      immuneBlocked: false,
    };
  }

  S.stats.successes++;

  /* 同一位對象只計數一次 */
  const isNew = !S.conquered.some((c) => c.name === target.name);
  if (isNew) {
    S.kills++;
    S.conquered.push({
      name: target.name, title: target.title || '', tier: target.tier || 'normal',
      semester: S.semester,
      /* 名冊抽完後隨機生成的路人。結局的歷任名單會把她們合併成一行,
       * 避免有名有姓的角色被大量路人淹沒。 */
      generated: !!target.generated,
    });
    S.rep += CONFIG.repPerConquest;
  }

  /* 技巧力成長:超過軟上限後減半 */
  const gain =
    S.ab.skl >= CONFIG.sklSoftCap ? CONFIG.sklOnSuccess / 2 : CONFIG.sklOnSuccess;
  addSkl(S, gain);

  /* 女角的特殊效果 */
  const { applied, fatal, std, immuneBlocked } = applyGirlEffect(S, target);
  if (fatal) S.stats.fatalGirl = target.name;

  return {
    success: true, rate, target, counted: isNew,
    sklGain: gain, applied, fatal, std, immuneBlocked,
  };
}

/* ================================================================
   src/core/girlpool.js
   ================================================================ */
/* 女角抽取:從名冊中依活動地點與權重挑人 */






/* 該活動可能出現、且尚未被攻略過的候選名單 */
function candidates(S, actId) {
  const act = ACT_BY_ID[actId];
  const done = new Set(S.conquered.map((c) => c.name));
  return GIRLS.filter((g) => {
    if ((S.excludedIds || []).includes(g.id)) return false;
    /* 可重複遇到的角色(例如校醫室的護理師)只有在攻略成功之後才會消失,
     * 出手失敗還可以再來。其他角色接觸過一次就不會再出現。 */
    if (g.repeatable) {
      if (done.has(g.name)) return false;
    } else if (S.metIds.includes(g.id)) {
      return false;
    }
    /* 專屬場所只讓明確指定在此出現的角色登場,不限地點的一般角色不會混進來 */
    if (act?.exclusive) return Array.isArray(g.where) && g.where.includes(actId);
    return girlAvailableAt(g, actId);
  });
}

/* 依權重抽一位。權重讓特殊角色比一般角色罕見得多 */
function weightedPick(list, rng) {
  const weights = list.map((g) => CONFIG.girlWeights[g.tier] ?? 1);
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return null;
  let r = rng.next() * total;
  for (let i = 0; i < list.length; i++) {
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length - 1];
}

/* 名冊抽完時的備援:隨機生成一位無特效的路人,避免遊戲卡住 */
function randomStranger(S, rng, actDiff) {
  return {
    id: null,
    name: makeName(rng),
    title: '路人',
    tier: 'normal',
    diff: actDiff,
    where: null,
    generated: true,
  };
}

/* 為一場活動抽出 n 位對象。同一場不重複 */
function drawGirls(S, actId, n, actDiff, rng) {
  const pool = candidates(S, actId);
  const picked = [];
  const usedThisRound = new Set();

  for (let i = 0; i < n; i++) {
    const avail = pool.filter((g) => !usedThisRound.has(g.id));
    let g = avail.length > 0 ? weightedPick(avail, rng) : null;

    if (!g) {
      /* 專屬場所(例如校醫室)不補隨機路人。
       * 那裡就只有指定的那個人,不該因為事件卡給了邂逅加成就憑空多出陌生人。 */
      if (ACT_BY_ID[actId]?.exclusive) break;
      if (!CONFIG.girlFallbackToRandom) break;
      picked.push(randomStranger(S, rng, actDiff));
      continue;
    }

    usedThisRound.add(g.id);
    /* 一般角色沒有專屬文案,補上通用句子 */
    picked.push({
      ...g,
      desc: g.desc || rng.pick(GENERIC_DESC),
      hit: g.hit || rng.pick(GENERIC_HIT),
    });
  }
  return picked;
}

/* ================================================================
   src/core/activity.js
   ================================================================ */
/* 社交活動:場次計算、可用活動過濾、邂逅對象生成、活動結算 */







/* 該學期的社交活動總場次 = 基礎(依體力) + 骰子兌換與事件卡的加成 */
function baseSlots(S) {
  return CONFIG.baseSlotConst + Math.floor(S.ab.sta / CONFIG.slotStaDiv);
}

function totalSlots(S) {
  return Math.max(0, baseSlots(S) + S.bonusSlots);
}

/* 列出所有活動並標記是否可參加 */
function listActivities(S) {
  const th = examThreshold(S.dept, S.semester);
  return ACTIVITIES.map((act) => {
    const ok = activityAvailable(act, S.ab, th.int);
    return {
      ...act,
      available: ok,
      lockReason: ok ? '' : activityLockReason(act, th.int),
    };
  });
}

/* 生成本場活動邂逅到的對象。從女角名冊抽人,難度以角色自身為準 */
function makeTargets(act, S, rng) {
  const n = Math.max(0, act.enc + S.encBonus);
  S.encBonus = 0;                      /* 邂逅加成一次用完 */
  return drawGirls(S, act.id, n, act.diff, rng);
}

/* 執行一場活動。
 *
 * 一般對象(名冊上的 63 位路人與隨機生成的)會立刻批次結算——這是遊戲的吞吐量主體。
 * 但有稱號的特殊角色不自動結算,而是被挑出來交給玩家逐一決定要不要出手。
 *
 * 這個設計是刻意的:如果特殊角色也自動結算,那麼「夜店常客」「來者不拒」
 * 這類稱號就只是裝飾,玩家看到的時候事情已經發生了,無從判斷也無從迴避;
 * 而且因為名冊會被接觸完,帶病與登出級的角色幾乎必定會遇到,
 * 導致實際的登出率遠高於名冊上的 2%。
 * 改成玩家決定之後,稱號就成為真正的情報,風險也回到玩家自己的選擇上。
 */
function runActivity(S, actId, rng) {
  const act = ACTIVITIES.find((a) => a.id === actId);
  if (!act) throw new Error(`未知活動:${actId}`);

  const th = examThreshold(S.dept, S.semester);
  if (!activityAvailable(act, S.ab, th.int)) {
    throw new Error(`活動門檻不足:${act.name}`);
  }

  S.stats.activitiesDone++;

  if (CONFIG.riskFromActivity) {
    S.risk += CONFIG.activityRiskValue[act.risk] || 0;
  }

  const targets = makeTargets(act, S, rng);
  const specials = targets.filter((t) => t.tier !== 'normal');
  const ordinary = targets.filter((t) => t.tier === 'normal');

  const results = ordinary.map((t) => attemptConquest(S, t, rng));
  const gained = results.filter((r) => r.counted).length;

  return { activity: act, results, gained, specials };
}

/* ================================================================
   src/core/exam.js
   ================================================================ */
/* 期末考與期中預警判定 */



/* 期末考:學力與肌力都要達標,任一未達標即退學 */
function runExam(S) {
  const th = examThreshold(S.dept, S.semester);
  const failInt = S.ab.int < th.int;
  const failStr = S.ab.str < th.str;
  const passed = !failInt && !failStr;

  const failed = [];
  if (failInt) failed.push({ key: 'int', name: '學力', have: S.ab.int, need: th.int });
  if (failStr) failed.push({ key: 'str', name: '肌力', have: S.ab.str, need: th.str });

  return { passed, threshold: th, failed };
}

/* 期中預警:計算距離本學期期末門檻還差多少 */
function midtermWarning(S) {
  const th = examThreshold(S.dept, S.semester);
  const gapInt = th.int - S.ab.int;
  const gapStr = th.str - S.ab.str;
  const warnings = [];
  if (gapInt > 0) warnings.push({ key: 'int', name: '學力', gap: gapInt, need: th.int, have: S.ab.int });
  if (gapStr > 0) warnings.push({ key: 'str', name: '肌力', gap: gapStr, need: th.str, have: S.ab.str });
  return { threshold: th, warnings, safe: warnings.length === 0 };
}

/* ================================================================
   src/core/eventcard.js
   ================================================================ */
/* 事件卡:抽取與效果結算 */






const ABILITY_KEYS = ['sta', 'int', 'str', 'skl', 'rand'];

/* 卡片是否符合當前狀態的出現條件 */
function cardEligible(card, S, phase) {
  if (!card.phase.includes(phase)) return false;
  if (card.dept && !card.dept.includes(S.dept)) return false;
  if (card.grade && !card.grade.includes(gradeOf(S.semester))) return false;
  if (card.once && S.usedEventIds.includes(card.id)) return false;
  if (S.semesterEventIds.includes(card.id)) return false;

  /* req:能力門檻或風評門檻 */
  if (card.req) {
    for (const [k, v] of Object.entries(card.req)) {
      if (k === 'rep') {
        if (S.rep < v) return false;
      } else if ((S.ab[k] ?? 0) < v) {
        return false;
      }
    }
  }
  return true;
}

function eligibleCards(S, phase) {
  return EVENTS.filter((c) => cardEligible(c, S, phase));
}

/* 抽一張卡 */
function drawCard(S, phase, rng) {
  const pool = eligibleCards(S, phase);
  if (pool.length === 0) return null;
  const card = rng.pick(pool);
  S.semesterEventIds.push(card.id);
  if (card.once) S.usedEventIds.push(card.id);
  return card;
}

/* 依應對方式的幅度縮放能力值效果
 * 權重 2 = 主要效果 → 變動量等於 mag
 * 權重 1 = 次要效果 → 變動量等於 ceil(mag / 2)
 */
function scaleAbility(weight, mag) {
  if (weight >= 2) return mag;
  return Math.ceil(mag / 2);
}

/* 套用效果物件。sign 為 +1(好結果)或 -1(壞結果) */
function applyEffects(S, effects, mag, sign, rng) {
  const applied = [];
  for (const [key, raw] of Object.entries(effects || {})) {
    if (ABILITY_KEYS.includes(key)) {
      const amount = scaleAbility(raw, mag) * sign;
      let target = key;
      if (key === 'rand') {
        target = rng.pick(['sta', 'int', 'str']);   /* 隨機一項,不含技巧力 */
      }
      const actual = target === 'skl' ? addSkl(S, amount) : addAb(S, target, amount);
      applied.push({ key: target, amount, actual });
    } else {
      /* 感情線與系統鍵值:不縮放,而且正負號直接寫在卡片資料裡,
       * 不隨好壞結果翻轉(例如壞結果的 rep:2 就是風評惡化 2 點)。 */
      const v = raw;
      switch (key) {
        case 'enc':  S.encBonus += v; break;
        case 'rep':  S.rep = Math.max(0, S.rep + v); break;
        case 'risk': S.risk += v; break;
        case 'slot': S.bonusSlots += v; break;
        case 'kill':
          S.kills += v;
          S.rep = Math.max(0, S.rep + CONFIG.repPerConquest * v);
          break;
        default: break;
      }
      applied.push({ key, amount: v, actual: v });
    }
  }
  return applied;
}

/* 結算一張卡:玩家選擇 response('bold'|'normal'|'safe') */
function resolveCard(S, card, response, rng) {
  const r = CONFIG.responses[response];
  if (!r) throw new Error(`未知應對方式:${response}`);

  const success = rng.chance(r.rate);
  const effects = success ? card.g : card.b;
  const applied = applyEffects(S, effects, r.mag, success ? 1 : -1, rng);

  return {
    card,
    response,
    responseLabel: r.label,
    success,
    text: success ? card.gt : card.bt,
    applied,
  };
}

/* 強制以「照常執行」的幅度套用壞結果(意外事件用) */
function forceBadOutcome(S, card, rng) {
  const mag = CONFIG.responses.normal.mag;
  const applied = applyEffects(S, card.b, mag, -1, rng);
  return { card, success: false, forced: true, text: card.bt, applied };
}

function eventsForPhase(phase) {
  return CONFIG.eventsPerPhase[phase] ?? 0;
}

/* ================================================================
   src/core/risk.js
   ================================================================ */
/* 風評與意外事件 */






/* 當學期意外事件的觸發機率 */
function accidentChance(S) {
  return clamp(S.risk, 0, CONFIG.riskCapPercent);
}

/* 學期結束前判定意外事件。觸發則強制結算一張風險類卡片的壞結果 */
function rollAccident(S, rng) {
  const p = accidentChance(S);
  if (!rng.chance(p)) return { triggered: false, chance: p };

  const pool = EVENTS.filter((c) => c.cat === 'risk');
  if (pool.length === 0) return { triggered: false, chance: p };

  const card = rng.pick(pool);
  const outcome = forceBadOutcome(S, card, rng);
  return { triggered: true, chance: p, outcome };
}

/* 學期結算:風評自然消退、風險歸零 */
function endOfSemesterDecay(S) {
  S.rep = Math.max(0, S.rep - CONFIG.repDecayPerSemester);
  S.risk = 0;
}

/* ================================================================
   src/core/namelist.js
   ================================================================ */
/* 歷任名單的組成規則
 *
 * 抽成純函式的理由:這條規則有兩種模式與一個門檻,如果寫在畫面程式裡,
 * 就只能靠人工在瀏覽器裡一種一種試,而且少量情境很難重現。
 * 抽出來之後可以直接寫測試把兩種模式都釘住。
 */



/* 回傳:
 *   mode      'full'   全部列出(含隨機路人)
 *             'merged' 只列名冊角色,路人併成一個數字
 *   named     要逐一列出的對象
 *   strangers 要被合併的路人數量(full 模式下為 0)
 */
function composeNamelist(conquered, threshold = CONFIG.namelistFullBelow) {
  const list = conquered || [];

  if (list.length === 0) {
    return { mode: 'full', named: [], strangers: 0 };
  }

  /* 人數少的時候每一個都值得留名字,連路人也列出來 */
  if (list.length <= threshold) {
    return { mode: 'full', named: list.slice(), strangers: 0 };
  }

  const named = list.filter((c) => !c.generated);
  return { mode: 'merged', named, strangers: list.length - named.length };
}

/* ================================================================
   src/core/ending.js
   ================================================================ */
/* 結局判定 — 依規格草案 8.2 節的雙軸設計
 * 主軸:人斬總數(六級);副軸:結束方式(畢業 / 退學 / 玩太大出事)
 */



function tierOf(kills) {
  for (const t of CONFIG.endingTiers) {
    if (kills >= t.min) return t;
  }
  return CONFIG.endingTiers[CONFIG.endingTiers.length - 1];
}

/* fatal 的語意是「從大學生活登出」——住院、被家裡關起來、學籍中斷,不是死亡 */
const SUFFIX = {
  graduated: '順利畢業',
  expelled: '中途退學',
  fatal: '提前登出',
};

function makeEnding(S) {
  const tier = tierOf(S.kills);
  const reason = S.overReason;
  const graduated = reason === 'graduated';
  /* 畢業時 semester 已經被推到第 9 個(超出總數才觸發畢業),
   * 顯示用的「就讀學期數」要夾回總學期數,否則會出現「9 / 8」。 */
  const semestersPlayed = Math.min(S.semester, CONFIG.totalSemesters);

  let gradLine;
  if (graduated) {
    gradLine = '你順利拿到了畢業證書。';
  } else if (reason === 'fatal') {
    gradLine = S.fatalReason
      || '你玩得太大了，而且對方不是你可以碰的人。你的大學生活在這裡按下了停止鍵。';
  } else {
    gradLine = `你的學生證在第 ${semestersPlayed} 個學期就被收回了。`;
  }

  const stdCfg = S.std ? CONFIG.std[S.std] : null;

  return {
    tier: tier.key,
    tierName: tier.name,
    headline: `${tier.name}・${SUFFIX[reason] || '結束'}`,
    reason,
    graduated,
    kills: S.kills,
    semestersPlayed,
    ab: { ...S.ab },
    rep: S.rep,
    conquered: S.conquered.slice(),
    mentorFound: S.mentorFound,
    std: S.std,
    stdName: stdCfg ? stdCfg.name : null,
    stdSemesters: S.stdSemesters || 0,
    stdCured: S.stdCured || 0,
    fatalGirl: S.stats.fatalGirl || null,
    gradLine,
    stats: {
      ...S.stats,
      successRate: S.stats.attempts > 0
        ? Math.round((S.stats.successes / S.stats.attempts) * 100)
        : 0,
    },
  };
}

/* ================================================================
   src/core/engine.js
   ================================================================ */
/* 學期流程狀態機
 *
 * 設計原則:引擎不碰 DOM、不使用回呼。它持有一個「當前待處理事項」(pending),
 * 外部(畫面或測試程式)讀取 pending、送出 submit(action),引擎推進到下一個 pending。
 * 這讓測試程式與真實畫面用完全相同的方式驅動遊戲。
 *
 * pending 的型別:
 *   { type:'dice',     dice:[n,n,n], assigned:[] }        玩家分配骰子
 *   { type:'event',    card, options:[...] }               玩家選擇應對方式
 *   { type:'midterm',  warning }                           期中預警,只需確認
 *   { type:'activity', list, slotsLeft, mentor? }           玩家選擇社交活動
 *   { type:'mentor',   session }                            老學長帶浪,只需確認
 *   { type:'exam',     result }                             期末考結果,只需確認
 *   { type:'accident', outcome }                            意外事件,只需確認
 *   { type:'semesterWrap' }                                 本學期社交結束,只需確認
 *   { type:'gameover', ending }                             結束
 *
 * semesterWrap 存在的理由:社交活動用完最後一場場次時,引擎原本會在同一次
 * submit() 呼叫裡直接往下跑完意外事件判定、期末考,一路跑到下一個真正需要
 * 玩家操作的關卡為止。畫面把同一次 submit() 新增的紀錄包成一個彈窗顯示,
 * 結果玩家點最後一場活動時,彈窗標題明明是那場活動,內容卻混進了不相干的
 * 期末考結果——版面看起來就像「多跑出一個不該出現的步驟」。
 * 加上這個檢查點,讓活動類動作永遠只產生自己的紀錄,其餘的意外事件與期末考
 * 都留到玩家按下這裡的確認之後才觸發,各自用原本就有的非彈窗畫面呈現。 */














function createGame({ name, dept, seed }) {
  const rng = createRng(seed);
  const S = newState({ name, dept, rng });

  /* 內部佇列:當前階段還要處理幾件事 */
  let queue = [];
  let pending = null;
  /* 一場活動裡遇到的特殊角色,等玩家逐一決定 */
  let specialQueue = [];
  let lastMentor = null;

  const game = {
    get state() { return S; },
    get pending() { return pending; },
    get seed() { return seed; },
    log: S.log,
  };

  /* ---------- 敘事紀錄 ---------- */
  function push(kind, title, text, extra = {}) {
    S.log.push({
      semester: S.semester,
      semesterName: SEMESTER_NAMES[S.semester - 1],
      phase: PHASES[S.phaseIndex],
      kind, title, text, ...extra,
    });
  }
  game.push = push;

  /* ---------- 階段內容建構 ---------- */

  function enterPhase() {
    const phase = PHASES[S.phaseIndex];
    queue = [];

    if (phase === 'H1') {
      /* 學期開始:重設當學期狀態 */
      S.semesterEventIds = [];
      S.bonusSlots = 0;
      S.encBonus = 0;
      push('info', `${SEMESTER_NAMES[S.semester - 1]} 開始`,
        `${S.year} 年，${S.deptName} ${S.name}，${gradeOf(S.semester)} 年級。`);
      queue.push({ kind: 'dice' });
      for (let i = 0; i < eventsForPhase('H1'); i++) queue.push({ kind: 'event' });
    } else if (phase === 'MID') {
      queue.push({ kind: 'midterm' });
      for (let i = 0; i < eventsForPhase('MID'); i++) queue.push({ kind: 'event' });
    } else if (phase === 'H2') {
      /* 社交活動期:場次用完為止 */
      S.slots = totalSlots(S);
      for (let i = 0; i < eventsForPhase('H2'); i++) queue.push({ kind: 'event' });
      queue.push({ kind: 'activityLoop' });
      queue.push({ kind: 'accident' });
    } else if (phase === 'FIN') {
      queue.push({ kind: 'exam' });
    } else if (phase === 'VAC') {
      for (let i = 0; i < eventsForPhase('VAC'); i++) queue.push({ kind: 'event' });
      queue.push({ kind: 'endSemester' });
    }

    step();
  }

  /* ---------- 佇列推進 ---------- */

  function step() {
    if (S.over) { pending = { type: 'gameover', ending: S.ending }; return; }

    if (queue.length === 0) {
      /* 本階段結束,進入下一階段 */
      S.phaseIndex++;
      if (S.phaseIndex >= PHASES.length) {
        S.phaseIndex = 0;
        S.semester++;
        S.age = CONFIG.startAge + Math.floor((S.semester - 1) / 2);
        S.year = CONFIG.startYear + Math.floor((S.semester - 1) / 2);
        if (S.semester > CONFIG.totalSemesters) {
          finish('graduated');
          return;
        }
      }
      enterPhase();
      return;
    }

    const item = queue.shift();

    switch (item.kind) {
      case 'dice': {
        const dice = [];
        for (let i = 0; i < CONFIG.dicePerSemester; i++) {
          dice.push(rng.int(1, CONFIG.diceFaces));
        }
        pending = { type: 'dice', dice, remaining: dice.slice(), assigned: [] };
        return;
      }
      case 'event': {
        const phase = PHASES[S.phaseIndex];
        const card = drawCard(S, phase, rng);
        if (!card) { step(); return; }     /* 卡池空了就跳過 */
        pending = {
          type: 'event',
          card,
          options: Object.entries(CONFIG.responses).map(([k, v]) => ({
            key: k, label: v.label, rate: v.rate, mag: v.mag,
          })),
        };
        return;
      }
      case 'midterm': {
        const w = midtermWarning(S);
        if (w.safe) {
          push('good', '期中考', '兩項門檻都已達標，這學期期末沒有懸念。');
        } else {
          const t = w.warnings
            .map((x) => `${x.name} 還差 ${x.gap} 點（目前 ${x.have}，期末需要 ${x.need}）`)
            .join('；');
          push('bad', '期中考警訊', `照這個進度期末會過不了：${t}。`);
        }
        pending = { type: 'midterm', warning: w };
        return;
      }
      case 'activityLoop': {
        openActivity();
        return;
      }
      case 'accident': {
        const r = rollAccident(S, rng);
        if (r.triggered) {
          push('bad', `意外事件：${r.outcome.card.n}`, r.outcome.text,
            { applied: r.outcome.applied, chance: r.chance });
          pending = { type: 'accident', outcome: r.outcome, chance: r.chance };
          return;
        }
        step();
        return;
      }
      case 'exam': {
        const result = runExam(S);
        if (result.passed) {
          push('good', '期末考', `學力 ${S.ab.int}／需要 ${result.threshold.int}，肌力 ${S.ab.str}／需要 ${result.threshold.str}。過了。`);
          pending = { type: 'exam', result };
        } else {
          const t = result.failed
            .map((f) => `${f.name} ${f.have}（需要 ${f.need}）`).join('、');
          push('bad', '期末考不及格', `${t}。你被二一了。`);
          finish('expelled');
        }
        return;
      }
      case 'endSemester': {
        S.stats.killsBySemester.push(
          S.kills - S.stats.killsBySemester.reduce((a, b) => a + b, 0),
        );
        endOfSemesterDecay(S);
        /* 帶病的話,每學期結算時扣能力與風評 */
        const p = applyStdPenalty(S);
        if (p) {
          push('bad', `病情｜${p.name}`,
            `已經帶著 ${p.name} 度過 ${p.semesters} 個學期，身體撐不住了。`,
            { applied: p.applied });
        }
        step();
        return;
      }
      default:
        step();
        return;
    }
  }

  /* ---------- 社交活動 ---------- */

  function openActivity() {
    /* 老學長帶浪優先提示(找到之後才會出現) */
    if (S.mentorFound && S.mentorSessionsLeft > 0 && S.slots >= CONFIG.mentorSlotCost) {
      const idx = CONFIG.mentorSessions - S.mentorSessionsLeft;
      pending = {
        type: 'activity',
        list: listActivities(S),
        slotsLeft: S.slots,
        mentor: {
          available: true,
          session: MENTOR_SESSIONS[idx],
          sklGain: CONFIG.mentorSklPerSession,
          cost: CONFIG.mentorSlotCost,
        },
        cure: cureOption(),
      };
      return;
    }

    if (S.slots <= 0) { pending = { type: 'semesterWrap' }; return; }

    pending = {
      type: 'activity',
      list: listActivities(S),
      slotsLeft: S.slots,
      mentor: { available: false },
      cure: cureOption(),
    };
  }

  /* 宣告取得性病免疫。狀態本身在 applyGirlEffect 已經設好了 */
  function announceImmunity(girl) {
    push('gold', '獲得免疫｜性病',
      `${girl.name} 把該講的都講清楚了，也把該給的都給你了。`
      + `\n從現在起，不論你去哪裡、遇到誰，都不會再被感染。`);
  }

  /* 特殊角色佇列:一場活動裡遇到的有稱號角色,逐一交給玩家決定 */
  function nextSpecial() {
    if (specialQueue.length === 0) { afterActivity(); return; }
    const girl = specialQueue.shift();
    pending = {
      type: 'special',
      /* 給畫面的資料刻意不含 tier 與 eff——玩家只能靠稱號與情境判斷,
       * 這正是這個機制的重點:資訊不完全下的風險決策 */
      girl: {
        name: girl.name, title: girl.title, desc: girl.desc, diff: girl.diff,
      },
      rate: Math.round(rateFor(S, girl)),
      remaining: specialQueue.length,
      /* 引擎自己結算時要用的完整資料 */
      girlFull: girl,
    };
  }

  /* 活動結束後的收尾:還有場次就繼續,沒有就進下一個階段 */
  function afterActivity() {
    if (S.slots > 0 || (lastMentor && S.mentorSessionsLeft > 0)) {
      lastMentor = null;
      openActivity();
    } else {
      lastMentor = null;
      pending = { type: 'semesterWrap' };
    }
  }

  /* 就醫選項:只有帶著可治癒的病、而且場次還夠的時候才出現 */
  function cureOption() {
    const info = stdInfo(S);
    if (!info) return { available: false };
    if (!info.curable) {
      return { available: false, incurable: true, name: info.name };
    }
    return {
      available: canCure(S),
      name: info.name,
      rate: info.cureRate,
      cost: info.cureSlots,
    };
  }

  /* ---------- 老學長發現判定 ---------- */

  function checkMentor(actId) {
    if (S.mentorFound) return null;
    if (gradeOf(S.semester) !== 1) return null;     /* 只在大一出現 */
    const m = MENTORS[S.dept];
    if (!m || m.activity !== actId) return null;

    S.mentorFound = true;
    S.mentorSessionsLeft = CONFIG.mentorSessions;
    push('gold', `隱藏角色：${m.name}`, `${m.desc}\n${m.result}`);
    return m;
  }

  /* ---------- 玩家動作 ---------- */

  game.submit = function submit(action) {
    if (!pending) throw new Error('目前沒有待處理事項');

    switch (pending.type) {
      case 'dice': {
        /* action: { assignments: [{die:index, to:'sta'|'int'|'str'|'social'}, ...] } */
        const { assignments } = action;
        if (!Array.isArray(assignments) || assignments.length !== pending.dice.length) {
          throw new Error(`必須分配全部 ${pending.dice.length} 顆骰`);
        }
        const parts = [];
        assignments.forEach((a) => {
          const pip = pending.dice[a.die];
          if (pip === undefined) throw new Error(`骰子索引無效:${a.die}`);
          if (a.to === 'social') {
            const gain = Math.floor(pip / CONFIG.slotPerDiceDiv);
            S.bonusSlots += gain;
            parts.push(`${pip} 點換社交場次 +${gain}`);
          } else if (CONFIG.allocatableAbilities.includes(a.to)) {
            const actual = addAb(S, a.to, pip);
            const names = { sta: '體力', int: '學力', str: '肌力' };
            parts.push(`${names[a.to]} +${actual}${actual < pip ? '（已達上限）' : ''}`);
          } else {
            throw new Error(`不可分配的目標:${a.to}`);
          }
        });
        push('info', '訓練成果', parts.join('，') + '。');
        step();
        return;
      }

      case 'event': {
        /* action: { response: 'bold'|'normal'|'safe' } */
        const res = resolveCard(S, pending.card, action.response, rng);
        push(res.success ? 'good' : 'bad',
          `事件卡｜${pending.card.n}（${res.responseLabel}）`,
          res.text, { applied: res.applied });
        step();
        return;
      }

      case 'midterm':
      case 'exam':
      case 'accident':
      case 'semesterWrap':
      case 'mentor': {
        /* 只需確認,沒有選項 */
        if (pending.type === 'mentor') {
          /* 帶浪結算已在 submit activity 時完成,這裡只是閱讀 */
        }
        step();
        return;
      }

      case 'activity': {
        /* action: { actId } 或 { mentor: true } 或 { skip: true } */
        if (action.skip) {
          S.slots = 0;
          pending = { type: 'semesterWrap' };
          return;
        }

        if (action.mentor) {
          if (!pending.mentor?.available) throw new Error('目前沒有帶浪機會');
          const idx = CONFIG.mentorSessions - S.mentorSessionsLeft;
          const session = MENTOR_SESSIONS[idx];
          S.slots -= CONFIG.mentorSlotCost;
          S.mentorSessionsLeft--;
          if (S.mentorSessionsLeft === 0) S.mentorDone = true;
          const actual = addSkl(S, CONFIG.mentorSklPerSession);
          push('gold', `老學長｜${session.n}`, session.text,
            { applied: [{ key: 'skl', amount: CONFIG.mentorSklPerSession, actual }] });
          openActivity();
          return;
        }

        if (action.cure) {
          const res = attemptCure(S, rng);
          if (res.cured) {
            push('good', `就醫｜${res.name}`,
              `療程結束，複檢結果是陰性。你把那張報告收進抽屜最裡面。`,
              { applied: res.applied });
          } else {
            push('bad', `就醫｜${res.name}`,
              `療程沒有奏效（成功率 ${res.rate}%），醫生要你下次再來一趟。`,
              { applied: res.applied });
          }
          openActivity();
          return;
        }

        const r = runActivity(S, action.actId, rng);
        S.slots--;

        /* 一般對象的批次結果。detail 給結構化資料,由畫面決定怎麼排 */
        if (r.results.length > 0) {
          const lines = r.results.map((x) => ({
            name: x.target.name,
            rate: Math.round(x.rate),
            ok: x.success,
          }));
          push(r.gained > 0 ? 'good' : 'info',
            `${r.activity.name}`,
            `接觸 ${r.results.length} 位，成立 ${r.gained} 位。`,
            { detail: lines, gained: r.gained });
        } else {
          push('info', `社交活動｜${r.activity.name}`, '這一場沒有遇到什麼普通的對象。');
        }

        /* 老學長發現判定(在活動之後,才有「活動中遇到他」的感覺) */
        lastMentor = checkMentor(action.actId);

        /* 有稱號的特殊角色排成佇列,交給玩家逐一決定 */
        specialQueue = r.specials.slice();
        if (specialQueue.length > 0) { nextSpecial(); return; }

        afterActivity();
        return;
      }

      case 'special': {
        /* action: { go: true } 出手 / { go: false } 收手 */
        const t = pending.girlFull;
        if (!action.go) {
          if (t.id && !S.metIds.includes(t.id)) S.metIds.push(t.id);
          push('info', `${t.name}｜${t.title}`,
            `${t.desc}\n你想了一下，決定今天先不要。`);
          nextSpecial();
          return;
        }

        const x = attemptConquest(S, t, rng);
        const kind = x.success
          ? (t.tier === 'positive' ? 'gold' : 'bad')
          : 'info';
        const body = x.success
          ? `${t.desc}\n${t.hit}`
          : `${t.desc}\n你出手了，但沒有成功（成功率 ${Math.round(x.rate)}%）。`;
        push(kind, `${t.name}｜${t.title}`, body, { applied: x.applied });

        if (x.std) {
          push('bad', `確診｜${x.std.info.name}`, x.std.info.desc);
        }
        if (x.immuneBlocked) {
          push('good', '沒事',
            '如果不是校醫室那位護理師當初講的那些，這次大概就中了。');
        }
        /* 免疫的取得條件是攻略成功(人斬 +1),收手與出手失敗都不算。
         * 效果本身已由 applyGirlEffect 套用,這裡只負責宣告。 */
        if (x.applied.some((a) => a.key === 'immune')) announceImmunity(t);

        /* 登出級女角:立刻結束,不再處理任何後續 */
        if (x.fatal) {
          S.fatalReason = x.fatal;
          finish('fatal');
          return;
        }

        nextSpecial();
        return;
      }

      case 'gameover':
        throw new Error('遊戲已結束');

      default:
        throw new Error(`未知的待處理型別:${pending.type}`);
    }
  };

  /* ---------- 結束 ---------- */

  function finish(reason) {
    S.over = true;
    S.overReason = reason;
    S.ending = makeEnding(S);
    /* fatal = 從大學生活登出(住院、被家裡帶回去關起來、學籍中斷) */
    const titles = { graduated: '畢業', expelled: '退學', fatal: '人生登出' };
    push(reason === 'graduated' ? 'gold' : 'bad',
      titles[reason] || '結束',
      `${S.ending.gradLine} 生涯人斬 ${S.kills} 人，評價：${S.ending.tierName}。`);
    pending = { type: 'gameover', ending: S.ending };
  }

  /* ---------- 對外輔助 ---------- */
  game.info = () => ({
    name: S.name, dept: S.deptName, age: S.age, year: S.year,
    semester: S.semester, semesterName: SEMESTER_NAMES[S.semester - 1] || '—',
    phase: PHASES[S.phaseIndex], grade: gradeOf(S.semester),
    ab: { ...S.ab }, pot: { ...S.pot }, ovr: ovr(S),
    kills: S.kills, rep: S.rep, risk: S.risk,
    slots: S.slots, baseSlots: baseSlots(S), bonusSlots: S.bonusSlots,
    exam: S.semester <= CONFIG.totalSemesters ? examThreshold(S.dept, S.semester) : null,
    accidentChance: accidentChance(S),
    mentorFound: S.mentorFound, mentorSessionsLeft: S.mentorSessionsLeft,
    std: S.std, stdName: S.std ? CONFIG.std[S.std].name : null,
    stdSemesters: S.stdSemesters || 0, immune: !!S.immune,
    over: S.over,
    /* 給頁首的學期進度格判斷「這一格是不是被退學的那一格」 */
    graduated: S.overReason === 'graduated',
  });

  /* 啟動 */
  enterPhase();
  return game;
}

/* ================================================================
   src/ui/render.js
   ================================================================ */
/* 畫面渲染與互動 — 唯一會碰 DOM 的檔案
 * 邏輯全部來自 core/engine.js;這裡只負責顯示與收集玩家輸入。
 */







const APP_VER = 'v0.2.0';
const $ = (id) => document.getElementById(id);

let game = null;
let seed = new URLSearchParams(location.search).get('seed') || randomSeed();
let chosenDept = 'ENG';
let lastRenderedLog = 0;
/* 「還去不了的地方」折疊區的開合狀態,記住玩家的偏好,不要每次重繪都收回去 */
let lockedOpen = false;
let curBlock = null;
let curBlockKey = '';

/* ================= 開場畫面 ================= */

function buildStart() {
  $('ver').textContent = APP_VER;
  $('seed-show').value = seed;

  const seg = $('seg-dept');
  seg.innerHTML = '';
  DEPT_KEYS.forEach((k) => {
    const b = document.createElement('button');
    b.dataset.v = k;
    b.textContent = DEPTS[k].name;
    if (k === chosenDept) b.className = 'on';
    b.onclick = () => {
      chosenDept = k;
      [...seg.children].forEach((c) => c.classList.toggle('on', c.dataset.v === k));
      showDeptNote();
    };
    seg.appendChild(b);
  });
  showDeptNote();

  $('seed-re').onclick = (e) => {
    e.preventDefault();
    seed = randomSeed();
    $('seed-show').value = seed;
  };
  $('seed-show').oninput = (e) => { seed = e.target.value.trim() || randomSeed(); };
  $('btn-start').onclick = start;
  $('btn-restart').onclick = () => { location.href = location.pathname; };

  /* 結果視窗的關閉方式:按繼續、點背景、或按 Esc。
   * 「繼續」按鈕每次開窗都會重建(結局畫面會換成別的按鈕),
   * 所以用事件委派綁在容器上,不要綁在按鈕本身。 */
  $('modal').onclick = (e) => {
    if (e.target.id === 'modal') closeModal();
    if (e.target.id === 'modal-ok') closeModal();
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOpen()) closeModal();
    /* 視窗開著的時候,Enter 與空白鍵也當作「繼續」 */
    if ((e.key === 'Enter' || e.key === ' ') && modalOpen()) {
      e.preventDefault();
      closeModal();
    }
  });
}

function showDeptNote() {
  const d = DEPTS[chosenDept];
  const s = d.start;
  $('dept-note').innerHTML =
    `<div class="n1">${d.note}</div>`
    + `<div class="n2">入學能力　體力 ${s.sta}　學力 ${s.int}　肌力 ${s.str}　技巧力 ${s.skl}<br>`
    + `畢業門檻　學力 ${d.examInt[7]}　肌力 ${d.examStr[7]}</div>`;
}

function start() {
  const name = ($('in-name').value || '').trim() || '朱董';
  seed = ($('seed-show').value || '').trim() || randomSeed();
  /* 只覆寫 seed,其他參數原樣保留。
   * 先前是直接寫成 '?seed=xxx',會把網址上其他參數全部吃掉。 */
  const q = new URLSearchParams(location.search);
  q.set('seed', seed);
  history.replaceState(null, '', `?${q.toString()}`);

  game = createGame({ name, dept: chosenDept, seed });
  $('start').style.display = 'none';
  $('board').style.display = '';
  $('act').style.display = '';
  $('act-toggle').style.display = '';
  $('act-toggle').onclick = () => {
    const a = $('act');
    a.classList.toggle('collapsed');
    $('act-toggle').textContent = a.classList.contains('collapsed') ? '展 開' : '收 合';
  };
  lastRenderedLog = 0;
  refresh();
}

/* ================= 記分板 ================= */

function board() {
  const i = game.info();

  $('bd-name').textContent = i.name;
  $('bd-meta').textContent =
    `${i.dept}　${i.year} 年　${i.age} 歲　綜合 ${i.ovr}`;

  /* 狀態標記:健康狀況與風評,用文件上的註記樣式呈現 */
  const flags = [];
  if (i.std) flags.push(`<span class="flag bad">確診 ${i.stdName}</span>`);
  else if (i.immune) flags.push('<span class="flag good">已具免疫</span>');
  if (i.rep >= 24) flags.push('<span class="flag bad">風評不佳</span>');
  else if (i.rep >= 10) flags.push('<span class="flag note">已有風聲</span>');
  if (i.mentorFound) flags.push('<span class="flag note">已受指導</span>');
  $('bd-flags').innerHTML = flags.join('');

  $('bd-kills').textContent = i.kills;

  /* 八個學期的進度格:過去實心、當前紅框、未來留白 */
  const strip = $('semstrip');
  strip.innerHTML = SEMESTER_NAMES.map((n, idx) => {
    const num = idx + 1;
    let cls = '';
    if (i.over && !i.graduated && num === i.semester) cls = 'fail';
    else if (num < i.semester) cls = 'done';
    else if (num === i.semester && !i.over) cls = 'now';
    return `<span class="sem ${cls}">${n.replace('大', '')}</span>`;
  }).join('');

  /* 五個階段:當前那個標紅並加底線,比燈號好讀 */
  $('phaseline').innerHTML = PHASES.map((p) =>
    `<span class="ph ${p === i.phase && !i.over ? 'on' : ''}">${PHASE_NAMES[p]}</span>`).join('');

  /* 能力細線條。紅色三角刻度標示本學期期末門檻,達標轉綠 */
  const rows = $('abrows');
  rows.innerHTML = '';
  for (const k of ['sta', 'int', 'str', 'skl']) {
    const v = i.ab[k];
    const cap = i.pot[k];
    const w = Math.min(100, (v / Math.max(cap, 1)) * 100);

    let need = null;
    if (i.exam && k === 'int') need = i.exam.int;
    if (i.exam && k === 'str') need = i.exam.str;
    const short = need !== null && v < need;

    let tick = '';
    if (need !== null) {
      const tp = Math.min(100, (need / Math.max(cap, 1)) * 100);
      tick = `<span class="tick ${short ? '' : 'met'}" style="left:${tp}%" `
        + `title="本學期期末門檻 ${need}"></span>`;
    }

    rows.insertAdjacentHTML('beforeend',
      `<div class="ab ${short ? 'short' : ''}">`
      + `<span class="nm">${ABL[k]}</span>`
      + `<span class="track"><span class="fill" style="width:${w}%"></span>${tick}</span>`
      + `<span class="val">${v}<s>/${cap}</s></span></div>`);
  }
}

/* ================= 紀錄卡片 ================= */

const EFFECT_NAMES = {
  ...ABL, enc: '邂逅機會', rep: '校內風評', risk: '意外風險',
  slot: '社交場次', kill: '人斬',
};

/* immune 與 std 不是數值型效果(std 的值甚至是字串,不是數字),
 * 而且兩者都已經有自己專屬的敘事卡片(「獲得免疫」「確診｜X」),
 * 這裡的效果標籤只負責數值型效果,重複顯示反而會露出未翻譯的內部代號。 */
const NON_DISPLAY_KEYS = new Set(['immune', 'std']);

function effectLine(applied) {
  if (!applied || applied.length === 0) return '';
  const visible = applied.filter((a) => !NON_DISPLAY_KEYS.has(a.key));
  if (visible.length === 0) return '';
  const parts = visible.map((a) => {
    const n = EFFECT_NAMES[a.key] || a.key;
    const v = a.actual !== undefined ? a.actual : a.amount;
    if (v === 0) return `${n} 沒有變化`;
    /* 風評與風險上升是壞事,顯示顏色要反過來 */
    const inverted = a.key === 'rep' || a.key === 'risk';
    const good = inverted ? v < 0 : v > 0;
    return `<span class="${good ? 'up' : 'dn'}">${n} ${v > 0 ? '+' : ''}${v}</span>`;
  });
  return `<div class="eff">${parts.join('　')}</div>`;
}

function logTarget(entry) {
  const key = `${entry.semester}`;
  if (curBlockKey !== key) {
    /* 收合前一個學期區塊 */
    if (curBlock) curBlock.classList.add('collapsed');
    const block = document.createElement('div');
    block.className = 'yr-block';
    block.innerHTML =
      `<div class="yr-head">${entry.semesterName}　${SEMESTER_NAMES[entry.semester - 1] ? '' : ''}</div>` +
      `<div class="yr-body"></div>`;
    block.querySelector('.yr-head').onclick = () => block.classList.toggle('collapsed');
    $('log').appendChild(block);
    curBlock = block;
    curBlockKey = key;

    /* 只保留最近幾個區塊,釋放 DOM */
    const blocks = $('log').querySelectorAll('.yr-block');
    if (blocks.length > 4) blocks[0].remove();
  }
  return curBlock.querySelector('.yr-body');
}

/* 把一則紀錄做成卡片元素。紀錄區與結果視窗共用同一份呈現邏輯,
 * 這樣兩邊看到的內容永遠一致,不會有一邊漏顯示效果明細的情況。 */
function makeCard(e) {
  const card = document.createElement('div');
  card.className = `card ${e.kind || ''}`;
  let html = `<h4>${e.title}</h4><p>${e.text}</p>`;
  html += effectLine(e.applied);
  /* 對象清單改成左右對齊的表格列:左邊姓名、右邊成功率與結果,
   * 比一整行文字好掃視 */
  if (e.detail && e.detail.length) {
    html += `<div class="det">${e.detail.map((d) => {
      const ok = d.ok;
      return `<span class="row ${ok ? 'ok' : ''}">`
        + `<b>${d.name}</b>`
        + `<span>${d.rate}%　${ok ? '成立' : '未成立'}</span></span>`;
    }).join('')}</div>`;
  }
  card.innerHTML = html;
  return card;
}

function renderLog() {
  const log = game.state.log;
  for (let i = lastRenderedLog; i < log.length; i++) {
    const e = log[i];
    logTarget(e).appendChild(makeCard(e));
  }
  lastRenderedLog = log.length;
  requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
}

/* ================= 結果視窗 =================
 * 社交活動階段的底部面板有多達十一個按鈕,會把紀錄區擠出畫面,
 * 玩家選完之後看不到結果。所以在那個階段的行動結果改用視窗跳出來。 */

let modalOnClose = null;

function showModal(title, entries, onClose) {
  const body = $('modal-body');
  body.innerHTML = '';
  entries.forEach((e) => body.appendChild(makeCard(e)));
  $('modal-head').textContent = title;

  /* 結局畫面會把視窗底部換成重玩按鈕,所以一般結果視窗每次都要還原成「繼續」 */
  const foot = $('modal-foot');
  foot.innerHTML = '';
  const ok = document.createElement('button');
  ok.className = 'btn main';
  ok.id = 'modal-ok';
  ok.textContent = '繼續';
  ok.onclick = closeModal;
  foot.appendChild(ok);

  modalOnClose = onClose || null;
  $('modal').classList.add('on');
  body.scrollTop = 0;
}

function closeModal() {
  $('modal').classList.remove('on');
  const fn = modalOnClose;
  modalOnClose = null;
  if (fn) fn();
}

function modalOpen() {
  return $('modal').classList.contains('on');
}

/* 送出動作,並把這次新增的紀錄用視窗呈現。
 * 用於社交活動階段的所有行動:參加活動、就醫、老學長帶浪、特殊角色出手或收手。 */
function submitWithModal(action, title) {
  const before = game.state.log.length;
  game.submit(action);
  const added = game.state.log.slice(before);

  board();
  renderLog();
  /* renderAction 在遊戲結束時會把結局填進視窗 */
  renderAction();

  const over = game.pending.type === 'gameover';

  if (added.length === 0) return;

  /* 如果這個行動剛好結束了遊戲,兩個視窗要串接而不是互相覆蓋:
   * 先看這次行動的結果(例如那位讓你登出的對象發生了什麼),
   * 按繼續之後才看生涯總結。
   * 先前這裡直接呼叫 showModal,會把 renderAction 填好的結局內容蓋掉,
   * 玩家永遠看不到總結。 */
  showModal(title, added, over ? () => showEndingModal(game.pending.ending) : null);
}

/* ================= 操作區 ================= */

function actTitle(t) { return `<div class="title">${t}</div>`; }

function renderAction() {
  const p = game.pending;
  const act = $('act');
  act.innerHTML = '';

  if (!p) return;

  switch (p.type) {
    case 'dice': return renderDice(p);
    case 'event': return renderEvent(p);
    case 'activity': return renderActivity(p);
    case 'special': return renderSpecial(p);
    case 'midterm': return renderConfirm('期中考', '知道了，繼續');
    case 'exam': return renderConfirm('期末考', p.result.passed ? '過關，繼續' : '繼續');
    case 'accident': return renderConfirm('意外事件', '認了，繼續');
    case 'semesterWrap': return renderConfirm('本學期社交活動結束', '查看期末結果');
    case 'gameover': return renderEnding(p.ending);
    default: return renderConfirm('繼續', '繼續');
  }
}

function renderConfirm(title, label) {
  const act = $('act');
  act.innerHTML = actTitle(title);
  void 0;
  const b = document.createElement('button');
  b.className = 'btn main';
  b.textContent = label;
  b.onclick = () => { game.submit({}); refresh(); };
  act.appendChild(b);
}

/* ---------- 骰子分配 ---------- */

/* 點數在九宮格上的位置。用真正的骰子點陣而不是印數字,
 * 一眼就看得出幾點,也比數字更像骰子。 */
const PIP_LAYOUT = {
  1: [5],
  2: [1, 9],
  3: [1, 5, 9],
  4: [1, 3, 7, 9],
  5: [1, 3, 5, 7, 9],
  6: [1, 3, 4, 6, 7, 9],
};

function makePips(pip) {
  const frag = document.createDocumentFragment();
  (PIP_LAYOUT[pip] || [5]).forEach((cell) => {
    const dot = document.createElement('i');
    dot.className = `pc${cell}`;
    frag.appendChild(dot);
  });
  /* 螢幕閱讀器與純文字備援用的點數 */
  const txt = document.createElement('b');
  txt.textContent = pip;
  frag.appendChild(txt);
  return frag;
}

function renderDice(p) {
  const act = $('act');
  const dice = p.dice;
  const used = new Array(dice.length).fill(false);
  const assignments = [];
  let active = 0;

  function draw() {
    act.innerHTML = actTitle(
      `本 學 期 配 額　<b>${assignments.length} / ${dice.length}</b>`);
    const hint = document.createElement('div');
    hint.className = 'desc';
    hint.textContent = '先點一顆骰子，再選它要投到哪裡。';
    act.appendChild(hint);

    const row = document.createElement('div');
    row.id = 'dice';
    dice.forEach((pip, i) => {
      const d = document.createElement('div');
      d.className = `die${used[i] ? ' used' : ''}${i === active && !used[i] ? ' active' : ''}${pip === 6 ? ' six' : ''}`;
      d.appendChild(makePips(pip));
      d.setAttribute('aria-label', `${pip} 點`);
      if (!used[i]) d.onclick = () => { active = i; draw(); };
      row.appendChild(d);
    });
    act.appendChild(row);

    if (assignments.length === dice.length) {
      const go = document.createElement('button');
      go.className = 'btn main';
      go.textContent = '確定分配 ▸';
      go.onclick = () => { game.submit({ assignments }); refresh(); };
      act.appendChild(go);
      const undo = document.createElement('button');
      undo.className = 'btn';
      undo.textContent = '↺ 重新分配';
      undo.onclick = () => {
        assignments.length = 0;
        used.fill(false);
        active = 0;
        draw();
      };
      act.appendChild(undo);
      return;
    }

    const pip = dice[active];
    const info = game.info();
    const grid = document.createElement('div');
    grid.className = 'alloc';

    const opts = [
      { to: 'sta', label: `體力 +${pip}`, note: `目前 ${info.ab.sta}／上限 ${info.pot.sta}　場次來源` },
      { to: 'int', label: `學力 +${pip}`, note: `目前 ${info.ab.int}　期末需要 ${info.exam?.int ?? '—'}` },
      { to: 'str', label: `肌力 +${pip}`, note: `目前 ${info.ab.str}　期末需要 ${info.exam?.str ?? '—'}` },
      (() => {
        const gain = Math.floor(pip / CONFIG.slotPerDiceDiv);
        return {
          to: 'social',
          label: `社交場次 +${gain}`,
          note: gain === 0
            ? `${pip} 點換不到場次（每 ${CONFIG.slotPerDiceDiv} 點換 1 場）`
            : `每 ${CONFIG.slotPerDiceDiv} 點換 1 場`,
          disabled: gain === 0,
        };
      })(),
    ];

    opts.forEach((o) => {
      const b = document.createElement('button');
      b.className = `btn${o.to === 'social' ? ' stamp' : ''}`;
      b.innerHTML = `${o.label}<small>${o.note}</small>`;
      /* 一點的骰子換不到任何場次(除以二向下取整),
       * 這種情況要把選項鎖住,不能讓玩家點一個什麼都不會發生的按鈕 */
      if (o.disabled) b.disabled = true;
      b.onclick = () => {
        if (o.disabled) return;
        assignments.push({ die: active, to: o.to });
        used[active] = true;
        const next = used.findIndex((u) => !u);
        active = next === -1 ? active : next;
        draw();
      };
      grid.appendChild(b);
    });
    act.appendChild(grid);
  }

  draw();
}

/* ---------- 事件卡 ---------- */

function renderEvent(p) {
  const act = $('act');
  act.innerHTML = actTitle(`事 件 記 錄　${p.card.n}`);
  const d = document.createElement('p');
  d.className = 'desc';
  d.textContent = p.card.desc;
  act.appendChild(d);

  /* 顯示順序:全力一搏 → 照常執行 → 保守應對(與原型截圖一致) */
  const order = ['bold', 'normal', 'safe'];
  order.forEach((key) => {
    const o = p.options.find((x) => x.key === key);
    if (!o) return;
    const b = document.createElement('button');
    b.className = `btn${key === 'normal' ? ' main' : ''}${key === 'bold' ? ' warn' : ''}`;
    b.innerHTML = `${o.label}<small>成功率 ${o.rate}%｜加成／減益幅度 ±${o.mag}</small>`;
    b.onclick = () => { game.submit({ response: key }); refresh(); };
    act.appendChild(b);
  });
}

/* ---------- 社交活動 ---------- */

function renderActivity(p) {
  const act = $('act');
  const i = game.info();
  act.innerHTML = actTitle(
    `行 程 安 排　<b>剩餘 ${p.slotsLeft} 場</b>`
    + `　　風評 ${i.rep}　意外風險 ${i.accidentChance}%`);

  if (p.mentor?.available) {
    const b = document.createElement('button');
    b.className = 'btn stamp';
    b.innerHTML = `${p.mentor.session.n}<small>` +
      `技巧力 +${p.mentor.sklGain}｜消耗 ${p.mentor.cost} 場｜機會有限</small>`;
    b.onclick = () => submitWithModal({ mentor: true }, '老學長帶你出門');
    act.appendChild(b);
  }

  /* 帶病時的就醫選項 */
  if (p.cure?.available) {
    const b = document.createElement('button');
    b.className = 'btn warn';
    b.innerHTML = `就醫治療 ${p.cure.name}<small>` +
      `治癒率 ${p.cure.rate}%｜消耗 ${p.cure.cost} 場｜不治療每學期扣能力</small>`;
    b.onclick = () => submitWithModal({ cure: true }, '就醫結果');
    act.appendChild(b);
  } else if (p.cure?.incurable) {
    const note = document.createElement('div');
    note.style.cssText =
      'font-family:var(--num);font-size:11.5px;color:var(--fail);background:var(--stamp-soft);'
      + 'border:1px solid var(--fail);border-radius:2px;padding:6px 9px;margin-top:7px';
    note.textContent = `${p.cure.name}：無法治癒，每學期都會持續扣能力與風評。`;
    act.appendChild(note);
  }

  const DIFF_N = { low: '低', mid: '中', high: '高' };
  const RISK_N = { none: '無', low: '低', mid: '中', high: '高', extreme: '極高' };

  function venueButton(a) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.disabled = !a.available;
    b.innerHTML = `${a.name}<b>${a.enc} 人</b><small>` +
      (a.available
        ? `難度 ${DIFF_N[a.diff]}｜風險 ${RISK_N[a.risk]}`
        : a.lockReason) + `</small>`;
    if (a.available) {
      b.onclick = () => submitWithModal({ actId: a.id }, a.name);
    }
    return b;
  }

  /* 去得了的地點:兩欄排列 */
  const open = p.list.filter((a) => a.available);
  const locked = p.list.filter((a) => !a.available);

  const grid = document.createElement('div');
  grid.className = 'venues';
  open.forEach((a) => grid.appendChild(venueButton(a)));
  act.appendChild(grid);

  /* 去不了的地點:收進折疊區,預設收合。
   * 保留它們是因為那些門檻本身就是玩家的成長目標,看得到才知道要練什麼。 */
  if (locked.length > 0) {
    const wrap = document.createElement('div');
    wrap.className = 'locked-wrap' + (lockedOpen ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'locked-head';
    head.innerHTML = `<span>還去不了的地方（${locked.length}）</span>`;
    head.onclick = () => {
      lockedOpen = !lockedOpen;
      wrap.classList.toggle('open', lockedOpen);
    };
    wrap.appendChild(head);

    const lockedGrid = document.createElement('div');
    lockedGrid.className = 'venues';
    locked.forEach((a) => lockedGrid.appendChild(venueButton(a)));
    wrap.appendChild(lockedGrid);

    act.appendChild(wrap);
  }

  const skip = document.createElement('button');
  skip.className = 'btn warn';
  skip.innerHTML = '這學期不再出門<small>放棄剩餘場次，直接進入期末</small>';
  skip.onclick = () => { game.submit({ skip: true }); refresh(); };
  act.appendChild(skip);
}

/* ---------- 特殊角色的出手決策 ---------- */

function renderSpecial(p) {
  const act = $('act');
  const g = p.girl;
  const diffN = { low: '低', mid: '中', high: '高' }[g.diff] || g.diff;

  act.innerHTML = actTitle(
    `個 案 附 件${p.remaining > 0 ? `　<b>本場尚有 ${p.remaining} 件</b>` : ''}`);

  const box = document.createElement('div');
  box.id = 'dossier';
  box.innerHTML =
    `<div class="dn">${g.name}<span class="dt">${g.title}</span></div>`
    + `<div class="dd">${g.desc}</div>`
    + `<div class="dm"><span>難度 ${diffN}</span><span>成功率 ${p.rate}%</span></div>`;
  act.appendChild(box);

  const go = document.createElement('button');
  go.className = 'btn stamp';
  go.innerHTML = `出手<small>成功率 ${p.rate}%｜後果視對象而定</small>`;
  go.onclick = () => submitWithModal({ go: true }, `${g.name}・${g.title}`);
  act.appendChild(go);

  const no = document.createElement('button');
  no.className = 'btn';
  no.innerHTML = '收手<small>不計入人斬，也不會有後果。她之後不再出現</small>';
  no.onclick = () => submitWithModal({ go: false }, `${g.name}・${g.title}`);
  act.appendChild(no);
}

/* ---------- 結局 ---------- */

/* 建立結局卡。會做兩份:一份放進紀錄區供之後回看,一份放進視窗立刻呈現。
 * 之所以要用視窗:結局卡高約 800px,而結局畫面的記分板加操作區佔掉六百多,
 * 可視區間只剩兩百出頭,等於要捲四次才讀得完最重要的一頁。 */
function buildEndingCard(e) {
  const card = document.createElement('div');
  card.className = 'card gold';

  /* 歷任名單。
   *
   * 衝量玩法一局會接觸兩百多位對象,名冊用完之後補的都是隨機路人,
   * 如果全部列出來,有名有姓的角色會被路人淹沒(實測 49 人裡有 27 個路人)。
   * 所以人數多的時候只列出名冊上的角色,路人合併成一行。
   * 但人數少的時候(門檻見 config.namelistFullBelow)還是全部列出來——
   * 只斬到幾個人的玩家,每一個都值得留名字。 */
  const TIER_CLASS = { positive: 'g', negative: 'b', fatal: 'b' };
  const label = (c) => {
    const t = c.title ? `${c.name}<span class="x">（${c.title}）</span>` : c.name;
    const cls = TIER_CLASS[c.tier];
    return cls ? `<span class="${cls}">${t}</span>` : t;
  };

  const nl = composeNamelist(e.conquered);
  let names;
  if (nl.named.length === 0 && nl.strangers === 0) {
    names = '（一位都沒有）';
  } else {
    const parts = [];
    if (nl.named.length > 0) parts.push(nl.named.map(label).join('、'));
    if (nl.strangers > 0) {
      parts.push(`<span class="x">以及 ${nl.strangers} 位記不住名字的</span>`);
    }
    names = parts.join('，<br>');
  }

  const stdRow = e.std
    ? `<tr><td>健康狀況</td><td style="color:var(--fail)">${e.stdName}（帶病 ${e.stdSemesters} 學期）</td></tr>`
    : `<tr><td>健康狀況</td><td>${e.stdCured > 0 ? `曾感染，已治癒 ${e.stdCured} 次` : '沒有問題'}</td></tr>`;

  const fatalRow = e.fatalGirl
    ? `<tr><td>登出原因</td><td style="color:var(--fail)">${e.fatalGirl}</td></tr>` : '';

  card.innerHTML = `
    <div class="end-hero">
      <div class="tier">${e.headline}</div>
      <div class="num"><b>${e.kills}</b><span>生 涯 人 斬</span></div>
    </div>
    <p>${e.gradLine}</p>
    <table class="fin">
      <tr><th>項目</th><th>數值</th></tr>
      <tr><td>就讀學期</td><td>${e.semestersPlayed} / ${CONFIG.totalSemesters}</td></tr>
      <tr><td>體力</td><td>${e.ab.sta}</td></tr>
      <tr><td>學力</td><td>${e.ab.int}</td></tr>
      <tr><td>肌力</td><td>${e.ab.str}</td></tr>
      <tr><td>技巧力</td><td>${e.ab.skl}</td></tr>
      <tr><td>攻略嘗試</td><td>${e.stats.attempts} 次</td></tr>
      <tr><td>攻略成功率</td><td>${e.stats.successRate}%</td></tr>
      <tr><td>社交活動</td><td>${e.stats.activitiesDone} 場</td></tr>
      <tr><td>校內風評</td><td>${e.rep}</td></tr>
      <tr><td>老學長</td><td>${e.mentorFound ? '找到了' : '始終沒遇到'}</td></tr>
      ${stdRow}
      ${fatalRow}
    </table>
    <div class="namelist"><span class="h">名 單</span>${names}</div>
  `;
  return card;
}

function renderEnding(e) {
  const act = $('act');
  act.innerHTML = '';

  /* 一份留在紀錄區,一份放進視窗 */
  logTarget({ semester: game.state.semester, semesterName: '結局' })
    .appendChild(buildEndingCard(e));

  /* 底部操作區:關掉視窗之後還是要能重玩 */
  act.innerHTML = actTitle(`檔 案 編 號　<b>${game.seed}</b>`);
  act.appendChild(replayButton('main'));
  act.appendChild(sameSeedButton());

  showEndingModal(e);
  requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
}

/* 結局用視窗全螢幕呈現,並把重玩按鈕直接放在視窗底部,
 * 玩家看完就能立刻再開一局,不用先關視窗再找按鈕。 */
function showEndingModal(e) {
  const box = $('modal-body');
  box.innerHTML = '';
  box.appendChild(buildEndingCard(e));
  $('modal-head').textContent = '結 案 報 告';

  const foot = $('modal-foot');
  foot.innerHTML = '';
  foot.appendChild(replayButton('main'));
  const close = document.createElement('button');
  close.className = 'btn';
  close.style.marginTop = '8px';
  close.textContent = '關閉，回頭翻紀錄';
  close.onclick = closeModal;
  foot.appendChild(close);

  modalOnClose = null;
  $('modal').classList.add('on');
  box.scrollTop = 0;
}

function replayButton(cls) {
  const b = document.createElement('button');
  b.className = `btn ${cls || ''}`;
  b.textContent = '重新建檔（換一個編號）';
  b.onclick = () => { location.href = location.pathname; };
  return b;
}

function sameSeedButton() {
  const b = document.createElement('button');
  b.className = 'btn';
  b.innerHTML = `用同一個編號重來<small>${game.seed}</small>`;
  b.onclick = () => {
    location.href = `${location.pathname}?seed=${encodeURIComponent(game.seed)}`;
  };
  return b;
}

/* ================= 主更新 ================= */

function refresh() {
  board();
  renderLog();
  renderAction();
}

buildStart();

/* 給瀏覽器主機測試用:暴露最小介面 */
window.__game = () => game;

/* ================= 本機開發用的自動推進 =================
 * 用途:視覺檢查。截圖工具會在呼叫時重新載入頁面,所以「先用程式驅動、再截圖」
 * 這條路不可靠;改成讓頁面在載入時就自己走到指定畫面,導航完直接截圖。
 *
 * 只在 localhost 生效,線上永遠不會觸發。
 * 用法:?auto=activity|special|exam|end&dept=LAW&seed=xxx
 */
(function devAutoPlay() {
  const local = ['127.0.0.1', 'localhost', ''].includes(location.hostname);
  const q = new URLSearchParams(location.search);
  const target = q.get('auto');
  if (!local || !target) return;

  const dept = q.get('dept') || 'ENG';
  $('in-name').value = q.get('name') || '朱董';
  const btn = [...$('seg-dept').children].find((b) => b.dataset.v === dept);
  if (btn) btn.click();
  $('btn-start').click();

  const modal = () => $('modal').classList.contains('on');
  const btns = () => [...$('act').querySelectorAll('button:not(:disabled)')];
  const pick = (kw) => btns().find((b) => b.textContent.includes(kw));

  let steps = 0;
  while (steps++ < 4000) {
    const p = game.pending;
    if (p.type === 'gameover') break;
    if (target === 'activity' && p.type === 'activity') break;
    if (target === 'special' && p.type === 'special') break;
    if (target === 'exam' && p.type === 'exam') break;

    if (modal()) {
      const ok = $('modal-ok');
      if (ok) { ok.click(); continue; }
      break;
    }

    if (p.type === 'dice') {
      for (let d = 0; d < p.dice.length; d++) {
        const opts = [...$('act').querySelectorAll('.alloc button:not(:disabled)')];
        const info = game.info();
        const th = info.exam;
        let want = '社交場次';
        if (info.ab.str < th.str + 5) want = '肌力';
        else if (info.ab.int < th.int + 5) want = '學力';
        (opts.find((b) => b.textContent.includes(want)) || opts[0]).click();
      }
      pick('確定分配')?.click();
    } else if (p.type === 'event') {
      (pick('保守應對') || btns()[0]).click();
    } else if (p.type === 'special') {
      (pick('出手') || btns()[0]).click();
    } else if (p.type === 'activity') {
      const t = btns().filter((b) => b.textContent.includes('人')).pop() || pick('帶浪');
      (t || pick('不再出門')).click();
    } else {
      btns()[0]?.click();
    }
  }
  window.scrollTo(0, 0);
}());
})();
</script>
